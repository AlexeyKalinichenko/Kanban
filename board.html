<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Канбан-доска</title>
<link rel="stylesheet" href="/static/fonts/nunito.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dialog.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="top-bar">
  <a href="/" class="back-button" title="На стартовую страницу" aria-label="На стартовую страницу"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <input id="board-title" class="board-title-input" type="text" value="Доска" maxlength="60" title="Название доски">
  <div class="bg-picker" id="bg-picker">
    <button type="button" class="bg-picker-btn" id="bg-picker-btn" title="Цвет фона доски" aria-label="Цвет фона доски" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2.2a1.8 1.8 0 0 0-1.3 3.1c.5.5.5 1.4 0 1.9-.6.6-1.6 1-2.5 1z"/><circle cx="7.5" cy="10.5" r="1.2" fill="currentColor"/><circle cx="12" cy="7" r="1.2" fill="currentColor"/><circle cx="16.5" cy="10.5" r="1.2" fill="currentColor"/></svg></button>
    <div class="bg-picker-menu" id="bg-picker-menu" role="menu">
      <div class="bg-picker-heading">Цвет фона</div>
      <div class="bg-picker-grid">
        <button type="button" class="bg-swatch" data-bg="blue" title="Синий" aria-label="Синий"></button>
        <button type="button" class="bg-swatch" data-bg="green" title="Зелёный" aria-label="Зелёный"></button>
        <button type="button" class="bg-swatch" data-bg="purple" title="Фиолетовый" aria-label="Фиолетовый"></button>
        <button type="button" class="bg-swatch" data-bg="red" title="Красный" aria-label="Красный"></button>
        <button type="button" class="bg-swatch" data-bg="yellow" title="Жёлтый" aria-label="Жёлтый"></button>
      </div>
      <div class="bg-picker-sep"></div>
      <button type="button" class="bg-picker-reset" data-bg="">Сбросить</button>
    </div>
  </div>
</div>

<div class="board" id="board"></div>

<script src="/static/dialog.js"></script>
<script src="/static/board-bg.js"></script>
<script src="/static/board.js"></script>

</body>
</html>
