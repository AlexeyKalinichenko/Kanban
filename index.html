<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои доски</title>
<link rel="stylesheet" href="/static/fonts/nunito.css">
<link rel="stylesheet" href="/static/start.css">
<link rel="stylesheet" href="/static/dialog.css">
<script src="/static/theme.js"></script>
</head>
<body>

<div class="account">
  <button id="account-btn" class="account-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Аккаунт" hidden></button>
  <div id="account-menu" class="account-menu" role="menu" hidden></div>
  <a id="login-btn" class="account-login-btn" href="/login" hidden>Войти</a>
</div>

<button id="theme-toggle" class="theme-toggle-btn" type="button" title="Переключить тему"></button>

<div class="page">
  <div class="header">
    <div class="title" id="page-title">Мои доски</div>
    <p class="subtitle" id="page-subtitle">Выберите одну или создайте новую.</p>
  </div>

  <div class="password-banner" id="password-banner" hidden></div>

  <!-- уведомление: вам открыли доступ к новой доске (static/start.js) -->
  <div class="shared-banner" id="shared-banner" hidden></div>

  <!-- вкладки — только если есть доски, к которым вам открыли доступ -->
  <div class="board-tabs" id="board-tabs" role="tablist" aria-label="Доски" hidden>
    <button type="button" class="board-tab" id="tab-own" role="tab" data-tab="own" aria-controls="boards-grid">Мои доски</button>
    <button type="button" class="board-tab" id="tab-shared" role="tab" data-tab="shared" aria-controls="shared-section">Доступные мне<span class="board-tab-count" id="shared-count"></span></button>
  </div>

  <div class="boards-grid" id="boards-grid" role="tabpanel"></div>

  <section class="shared-section" id="shared-section" role="tabpanel" hidden>
    <div class="boards-grid" id="shared-grid"></div>
  </section>
</div>

<script src="/static/auth.js"></script>
<script src="/static/dialog.js"></script>
<script src="/static/guest.js"></script>
<script src="/static/account.js"></script>
<script src="/static/start.js"></script>
</body>
</html>
